# Vùng giới hạn request theo IP. Nằm ở khối http nên nạp qua conf.d, một lần (docs/deploy.md mục Nginx):
#   ln -s /opt/mgi-bank/deploy/nginx/limits.conf /etc/nginx/conf.d/mgi-bank-limits.conf
# Ngưỡng cao vì cả trường dùng chung một IP Wi-Fi: một lớp quét QR cùng lúc là vài trăm request trong vài giây.
limit_req_zone $binary_remote_addr zone=mgi_bank_ip:20m rate=30r/s;
# Gửi ảnh nặng tới 20 MB một lượt và bucket chưa có trần tổng dung lượng: vùng riêng chặt hơn.
limit_req_zone $binary_remote_addr zone=mgi_bank_photo:10m rate=2r/s;
# 429 chứ không 503: 503 là mã của trang bảo trì.
limit_req_status 429;
limit_req_log_level warn;
