# Vùng giới hạn request theo IP. Nằm ở khối http nên nạp qua conf.d, một lần (docs/deploy.md mục Nginx):
#   ln -s /opt/mgi-bank/deploy/nginx/limits.conf /etc/nginx/conf.d/mgi-bank-limits.conf
# Ngưỡng cao vì cả trường dùng chung một IP Wi-Fi: một lớp quét QR cùng lúc là vài trăm request trong vài giây.
limit_req_zone $binary_remote_addr zone=mgi_bank_ip:20m rate=30r/s;
# Mỗi ảnh một request, tới 20 MB. 300 học sinh chung một IP, mỗi em 3 tới 6 ảnh trong 10 phút là tới 1.800 request:
# 10 request mỗi giây (6.000 trong 10 phút) cộng dồn 300 cho một lớp gửi cùng lúc. Vùng riêng để ảnh không ăn vào ngưỡng của trang.
limit_req_zone $binary_remote_addr zone=mgi_bank_photo:10m rate=10r/s;
# B1 tạo hồ sơ: 300 em trong 10 phút, một lớp 40 em cùng lúc. Chặt hơn vùng chung để một máy không đổ hàng nghìn hồ sơ rác.
limit_req_zone $binary_remote_addr zone=mgi_bank_create:10m rate=2r/s;
# 429 chứ không 503: 503 là mã của trang bảo trì.
limit_req_status 429;
limit_req_log_level warn;
