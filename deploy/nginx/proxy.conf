# Header chuyển tiếp dùng chung cho mọi khối location gọi vào app, để các khối không lệch nhau.
proxy_http_version 1.1;
# src/proxy.ts chọn trang quản lý hay trang học sinh theo Host: thiếu dòng này thì mọi trang trả 404.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Ghi đè, không nối: app lấy địa chỉ cuối của header này làm IP người gửi (src/server/http/ip.ts); địa chỉ người gửi tự khai bị bỏ.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
# Ảnh 20 MB qua 4G yếu ở trường mất hơn 60 giây mặc định.
proxy_read_timeout 300s;
