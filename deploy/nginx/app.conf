# Phần cấu hình Nginx thuộc về app, include trong khối server của từng tên miền (mẫu ở deploy/nginx/site.conf.example).
# Khối server đặt hai biến trước dòng include:
#   set $mgi_bank_upstream 127.0.0.1:3200;   cổng app trên máy chủ (bản test: 3210)
#   set $mgi_bank_root /opt/mgi-bank;         thư mục repo, chứa trang bảo trì (bản test: /opt/mgi-bank-test)
# Không đưa file site trên máy chủ vào repo: certbot ghi khối https vào file đó, git reset lúc deploy sẽ xoá mất.

# Ảnh học sinh và ảnh thay thế gửi qua app, tối đa 20 MB một ảnh cộng phần bao của multipart.
client_max_body_size 22m;

# Bảo trì bật bằng sự tồn tại của một file (deploy/maintenance-on.sh): bật tắt không cần reload Nginx.
set $maintenance 0;
if (-f $mgi_bank_root/deploy/maintenance/on) { set $maintenance 1; }

# File tĩnh có mã băm trong tên: không tính vào giới hạn request, cả lớp tải trang lần đầu cùng lúc.
location ~ ^/(_next/static/|brand/|zxing_reader\.wasm$) {
    include /opt/mgi-bank/deploy/nginx/proxy.conf;
    proxy_pass http://$mgi_bank_upstream;
}

location ^~ /api/customers/me/photos {
    limit_req zone=mgi_bank_photo burst=200 nodelay;
    # Không dùng dấu =: error_page 503 = @x lấy mã của khối được gọi, trang tĩnh ra 200 thay vì 503.
    error_page 503 @maintenance_json;
    if ($maintenance) { return 503; }
    include /opt/mgi-bank/deploy/nginx/proxy.conf;
    proxy_pass http://$mgi_bank_upstream;
}

location /api/ {
    limit_req zone=mgi_bank_ip burst=600 nodelay;
    error_page 503 @maintenance_json;
    if ($maintenance) { return 503; }
    include /opt/mgi-bank/deploy/nginx/proxy.conf;
    proxy_pass http://$mgi_bank_upstream;
}

location / {
    limit_req zone=mgi_bank_ip burst=600 nodelay;
    error_page 503 @maintenance_html;
    if ($maintenance) { return 503; }
    include /opt/mgi-bank/deploy/nginx/proxy.conf;
    proxy_pass http://$mgi_bank_upstream;
}

location @maintenance_html {
    root $mgi_bank_root/deploy/maintenance;
    default_type text/html;
    # 503 chứ không 200: trả 200 thì trang bảo trì nằm lại trong cache sau khi đã tắt.
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =503;
}

# API trả JSON: web gọi bằng fetch rồi đọc message, nhận trang HTML thì báo lỗi cú pháp thay vì báo bảo trì.
location @maintenance_json {
    default_type application/json;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"message":"Hệ thống đang bảo trì. Thử lại sau ít phút."}';
}
